    #mkvAdvancedContainer { display:block; width:100vw; height:56.25vw; max-height:100vh; max-width:177.78vh; margin:auto; background:#000; position:relative; }
    #mkvAdvancedMount {
      position:absolute; inset:0; width:100%; height:100%;
      z-index:1; pointer-events:auto;
    }
    #mkvAdvancedContainer movi-player {
      display:block; position:relative; width:100%; height:100%;
      min-height:320px; background:#000; pointer-events:auto;
    }
    #mkvStatus {
      position:absolute; z-index:30; top:0; left:0; right:0;
      color:#ddd; font:14px sans-serif; padding:8px 12px;
      background:#181818; pointer-events:none;
    }
    #mkvAdvancedTitle {
      display:none !important;
      position:absolute; z-index:20; top:0; left:0; right:0;
      padding:18px 26px 24px; color:#fff; font-size:24px; font-weight:700;
      letter-spacing:.3px; line-height:1.2; pointer-events:none;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
      background:linear-gradient(to bottom, rgba(0,0,0,.72), transparent);
      opacity:0; transform:translateY(-8px); transition:opacity .25s, transform .25s;
    }
    #mkvAdvancedContainer.mkv-title-visible #mkvAdvancedTitle { opacity:1; transform:translateY(0); }
    #mkvAdvancedContainer.mkv-paused #mkvAdvancedTitle { opacity:1; transform:translateY(0); }
    #returnNativePlayer { display:none !important; }
    html, body {
      margin: 0;
      padding: 0;
      background: #111;
      width: 100%;
      min-height: 100vh;
      font-family: sans-serif;
      display: block;
      overflow-x: hidden;
    }

    /* Inputs ocultos (atajos: V video, S subtítulos) */
    input[type="file"] { display: none; }

    #videoContainer {
      position: relative;

    /* 👇 CLAVE: forzar 16:9 real del TV */
      width: 100vw;
      height: 56.25vw; /* 16:9 */
      max-height: 100vh;
      max-width: 177.78vh; /* mantiene proporción */
      margin: auto;
      background: black;
    }

    /* ===== PLYR - tamaños reales (sin scale) ===== */
    .plyr {
      position: relative;
      height: 100%;
      --plyr-color-main: #00b7ff;

      /* Base grandes */
      --plyr-font-size-base: 16px;
      --plyr-font-size-time: 18px;        /* tiempos (actual/restante) */
      --plyr-control-icon-size: 28px;
      --plyr-control-spacing: 14px;
      --plyr-control-padding: 10px;

      /* Barra de progreso gruesa */
      --plyr-range-track-height: 10px;
      --plyr-range-thumb-height: 18px;
    }

    .plyr__controls {
      position: absolute;
      bottom: 0; left: 0; width: 100%;
      padding: 16px 14px;
      gap: 12px;
      min-height: 68px;
      display: flex; align-items: center;
      box-sizing: border-box;
    }

    .plyr__control { width: 44px; height: 44px; box-sizing: border-box; }
    .plyr__control svg { width: 28px !important; height: 28px !important; }

    /* Tiempos bien legibles */
    .plyr__time, .plyr__menu__value {
      font-size: var(--plyr-font-size-time);
      line-height: 1;
    }

    /* Progreso alto acorde al grosor */
    .plyr__progress { height: 26px; display: flex; align-items: center; }
    .plyr__progress input[type=range] { height: 22px; }

    /* === Indicador de tiempo sobre la barra (como tu versión previa) === */
    .plyr__progress .plyr__time-indicator {
      position: absolute;
      bottom: 30px;                 /* ajusta si lo quieres más bajo */
      left: 0;
      transform: translateX(-50%);
      font-size: 17px;
      color: #000;                  /* texto negro */
      background: #fff;             /* fondo blanco */
      padding: 4px 8px;
      border-radius: 6px;
      pointer-events: none;
      white-space: nowrap;
      opacity: 0;
      transition: opacity .3s ease;
    }

    .plyr__progress .plyr__time-indicator::after {
      content:"";
      position:absolute;
      bottom:-6px;
      left:50%;
      transform:translateX(-50%);
      border-width:6px 6px 0 6px;
      border-style:solid;
      border-color:#fff transparent transparent transparent; /* punta blanca */
    }

    .plyr--hover .plyr__progress .plyr__time-indicator { opacity: 1; }

    #videoContainer video {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: contain;
  background: #000;

  /* 🔥 AÑADIR ESTO */
  transform: translateZ(0);
  will-change: transform;
  backface-visibility: hidden;
}

    .plyr__captions {
      font-size: 2em !important;
      color: yellow !important;
      text-shadow: 1px 1px 2px black !important;
      background: transparent !important;
    }
    ::cue {
      color: yellow; background: transparent; font-size: 1.3em;
      font-family: Arial, sans-serif; text-shadow: 1px 1px 2px black;
    }

    .overlay-icon {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(0.6);
      opacity: 0; transition: opacity .3s ease, transform .3s ease;
      pointer-events: none; z-index: 10;
    }
    .overlay-icon.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

    /* ===== Banner superior tipo Netflix ===== */
    .title-banner{
  position:absolute; top:0; left:0; right:0;
  padding:22px 26px 28px;

  /* ❌ sin fondo, sin sombra, sin blur */

  color:#fff;
  font-size:24px;
  font-weight:700;
  letter-spacing:.4px;
  line-height:1.2;

  opacity:0;
  transform: translateY(-14px);
  transition:
    opacity .25s linear,
    transform .25s linear;

  pointer-events:none;
  z-index:15;
  white-space:nowrap;
  text-overflow:ellipsis;
  overflow:hidden;
}


    .plyr--hover .title-banner, .title-banner.show { opacity:1; transform:translateY(0); }
    .plyr--hide-controls .title-banner{ opacity:0 !important; transform:translateY(-8px) !important; }

    /* ===== Pantalla completa: todo más grande ===== */
    .plyr--fullscreen,
    :fullscreen .plyr {
      --plyr-font-size-base: 17px;
      --plyr-font-size-time: 19px;
      --plyr-control-icon-size: 32px;
      --plyr-control-spacing: 16px;
      --plyr-control-padding: 12px;

      --plyr-range-track-height: 12px;
      --plyr-range-thumb-height: 20px;
    }

    .plyr--fullscreen .plyr__controls,
    :fullscreen .plyr__controls {
      padding: 18px 16px;
      min-height: 76px;
      gap: 14px;
    }

    .plyr--fullscreen .plyr__control,
    :fullscreen .plyr__control { width: 48px; height: 48px; }
    .plyr--fullscreen .plyr__control svg,
    :fullscreen .plyr__control svg { width: 32px !important; height: 32px !important; }

    .plyr--fullscreen .plyr__progress,
    :fullscreen .plyr__progress { height: 30px; }
    .plyr--fullscreen .plyr__progress input[type=range],
    :fullscreen .plyr__progress input[type=range] { height: 26px; }

    .plyr--fullscreen .plyr__progress .plyr__time-indicator,
    :fullscreen .plyr__progress .plyr__time-indicator {
      bottom: 30px;           /* tu valor actual para fullscreen */
      font-size: 18px;
      padding: 5px 9px;
    }

    .plyr--fullscreen .title-banner,
    :fullscreen .title-banner {
      padding: 24px 28px 28px;
      font-size: 28px;
      transform: translateY(-10px);
    }
/* ==========================================================================
   SOLUCIÓN DEFINITIVA: ANULAR EL ANCHO FIJO DEL BOTÓN "VOLVER"
   ========================================================================== */
.plyr--fullscreen .plyr__menu__container .plyr__control--back,
:fullscreen .plyr__menu__container .plyr__control--back {
    width: 90% !important;
}

    /* ====== AJUSTES ANTI-FOCO (para quitar el rayado) ====== */
    .plyr__controls button:focus,
    .plyr__controls input:focus {
      outline: none;
      box-shadow: none;
    }
    /* Firefox: quita halo extra del range */
    .plyr__progress input[type="range"]::-moz-focus-outer { border: 0; }

    /* Unifica el tooltip de búsqueda con el globito (mismo estilo/tamaño) */
    .plyr{
      /* colores y medidas del tooltip nativo de Plyr */
      --plyr-tooltip-radius: 6px;
      --plyr-tooltip-padding: 4px 8px;
      --plyr-tooltip-arrow-size: 6px;
      --plyr-tooltip-shadow: none;
      --plyr-font-size-small: 17px; /* tamaño del número del tooltip */
    }

    /* Colócalo a la misma altura que tu time-indicator */
    .plyr__progress .plyr__tooltip{
      top: auto !important;
      bottom: 18px !important;     /* MISMA altura que tu .plyr__time-indicator */
      transform: translate(-50%, 0) !important;
      z-index: 12;
    }

    /* En fullscreen, mantén la misma alineación (ajusta si cambias tu indicador) */
    .plyr--fullscreen .plyr__progress .plyr__tooltip,
    :fullscreen .plyr__progress .plyr__tooltip{
      top: auto !important;
      bottom: 20px !important;     /* usa el mismo valor que tengas para fullscreen */
      transform: translate(-50%, 0) !important;
    }

    /* Tooltip nativo de Plyr: estilo blanco y misma altura */
    .plyr {
      --plyr-tooltip-background: #fff;
      --plyr-tooltip-color: #000;
      --plyr-tooltip-radius: 6px;
      --plyr-tooltip-padding: 4px 8px;
      --plyr-tooltip-arrow-size: 6px;
      --plyr-tooltip-shadow: none;
      --plyr-font-size-small: 17px;
    }

    .plyr__progress .plyr__tooltip{
      top: auto !important;
      bottom: 17px !important;
      transform: translate(-50%, 0) !important;
      z-index: 12;
    }

    /* === FULLSCREEN: igualar tamaño y altura del tooltip con el globito === */
    .plyr--fullscreen,
    :fullscreen .plyr{
      /* el tooltip de Plyr usa estas variables */
      --plyr-font-size-small: 18px;   /* igual que tu time-indicator */
      --plyr-tooltip-padding: 5px 9px;/* igual que tu time-indicator */
      --plyr-tooltip-arrow-size: 6px; /* misma punta */
    }

    .plyr--fullscreen .plyr__progress .plyr__tooltip,
    :fullscreen .plyr__progress .plyr__tooltip{
      bottom: 18px !important;        /* MISMA altura que .plyr__time-indicator en fullscreen */
      transform: translate(-50%, 0) !important;
    }

    /* Ocultar el indicador de tiempo transcurrido mientras se busca (drag) */
    .plyr--seeking .plyr__time-indicator {
      opacity: 0 !important;
    }

    /* Ocultar también cuando SOLO pasas por la barra (hover/scrub) */
    .plyr--scrubbing .plyr__time-indicator {
      opacity: 0 !important;
    }

    /* ===== Settings visibles y por encima de todo (fix corte en fullscreen) ===== */
    .plyr__controls{ overflow: visible; z-index: 20; }
    .plyr__menu, .plyr__menu__container{ z-index: 50; }
    .plyr--fullscreen .plyr__controls{ z-index: 60; }
    .plyr--fullscreen .plyr__menu__container{ z-index: 70; }
    /* Menú sin scroll innecesario */
    .plyr__menu__container{
      max-height: none !important;
      overflow: visible !important;
    }

    /* Distribuir título y valor a la derecha en cada opción del menú */
    .plyr__menu__container [role="menu"] button{
      display: flex !important;
      align-items: center !important;
      justify-content: space-between !important;
      gap: 12px !important;
      width: 100% !important;
    }

    .plyr__menu__container .plyr__menu__value{
      flex: 0 0 auto !important;
      max-width: 60% !important;
      overflow: hidden !important;
      text-overflow: ellipsis !important;
      white-space: nowrap !important;
      text-align: right !important;
    }

    /* ——— Fix: que no se corte “Español” en el menú ——— */
    .plyr__menu__container [role="menu"] button{
      padding-right: 28px !important;   /* espacio para la flecha del submenú */
    }

    .plyr__menu__container .plyr__menu__value{
      flex: 0 1 auto !important;        /* que pueda crecer un poco si lo necesita */
      max-width: none !important;       /* quitar el límite del 60% que lo truncaba */
      overflow: visible !important;     /* no esconder el último carácter */
      white-space: nowrap !important;   /* que siga en una sola línea */
    }
    /* 🔥 Optimización UI para Chromecast */
.plyr, .overlay-icon, .title-banner {
  will-change: opacity, transform;
}

<body>

  <!-- Sin título duplicado fuera del reproductor -->
  <input type="file" id="fileInput" accept="video/mp4,video/x-matroska,video/webm" />
  <input type="file" id="subtitleFile" accept=".srt" />

  <div id="videoContainer" style="display:none">
    <video id="player" controls crossorigin playsinline preload="auto">
      <track id="subtitleTrack" kind="subtitles" label="Español" srclang="es" default />
    </video>

    <!-- Banner de título -->
    <div class="title-banner" id="titleBanner">
      <span id="videoTitle">Media Player</span>
    </div>

    <div id="playPauseOverlay" class="overlay-icon">
      <svg id="overlayIcon" viewBox="0 0 24 24" fill="white" width="72" height="72"></svg>
    </div>
  </div>

  <!-- Reproductor principal para todos los formatos compatibles -->
  <div id="mkvAdvancedContainer">
    <div id="mkvStatus">Selecciona un video con la tecla V para comenzar.</div>
    <div id="mkvAdvancedMount"></div>
    <div id="mkvAdvancedTitle" aria-live="polite">Media Player</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/movi-player/dist/element.global.js"></script>
  <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
  <script>
    const player = new Plyr('#player', {
      captions: { active: true, language: 'es', update: true },
      invertTime: true, // tiempo restante en negativo
      controls: ['play','progress','current-time','mute','volume','captions','settings','fullscreen'],
      settings: ['captions','speed'],
      speed: { selected: 1, options: [0.5, 0.75, 1, 1.25, 1.5, 2] }
    });

    const fileInput = document.getElementById('fileInput');
    const subtitleInput = document.getElementById('subtitleFile');
    const video = document.getElementById('player');
    const track = document.getElementById('subtitleTrack');
    const overlay = document.getElementById('playPauseOverlay');
    const overlayIcon = document.getElementById('overlayIcon');
    const titleBanner = document.getElementById('titleBanner');
    const videoTitleEl = document.getElementById('videoTitle');
    const videoContainer = document.getElementById('videoContainer');

    // ====== AUDIO WEB API: Boost + Normalización ======
    let audioCtx, sourceNode, gainNode, compressorNode;
    let voiceEQ;
    let musicReducer;
    let smartLimiter;
    let isBoostOn = false, isNormalizeOn = false;

    function setupAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        // Fuente desde el <video>
        sourceNode = audioCtx.createMediaElementSource(video);

	voiceEQ = audioCtx.createBiquadFilter();
	voiceEQ.type = "peaking";
	voiceEQ.frequency.setValueAtTime(3000, audioCtx.currentTime);
	voiceEQ.Q.setValueAtTime(1.2, audioCtx.currentTime);
	voiceEQ.gain.setValueAtTime(4, audioCtx.currentTime);

	musicReducer = audioCtx.createBiquadFilter();
	musicReducer.type = "lowshelf";
	musicReducer.frequency.setValueAtTime(200, audioCtx.currentTime);
	musicReducer.gain.setValueAtTime(-6, audioCtx.currentTime);

        // Compresor para "normalización"
        compressorNode = audioCtx.createDynamicsCompressor();
	smartLimiter = audioCtx.createDynamicsCompressor();
	smartLimiter.threshold.setValueAtTime(-12, audioCtx.currentTime);
	smartLimiter.knee.setValueAtTime(10, audioCtx.currentTime);
	smartLimiter.ratio.setValueAtTime(6, audioCtx.currentTime);
	smartLimiter.attack.setValueAtTime(0.003, audioCtx.currentTime);
	smartLimiter.release.setValueAtTime(0.25, audioCtx.currentTime);

        // Ajustes suaves y seguros
        compressorNode.threshold.setValueAtTime(-20, audioCtx.currentTime);
	compressorNode.knee.setValueAtTime(18, audioCtx.currentTime);
	compressorNode.ratio.setValueAtTime(4, audioCtx.currentTime);
	compressorNode.attack.setValueAtTime(0.01, audioCtx.currentTime);
	compressorNode.release.setValueAtTime(0.35, audioCtx.currentTime);

        // Ganancia (para boost)
        gainNode = audioCtx.createGain();
        gainNode.gain.value = 1;

        // Conexión inicial (sin normalizar)
        connectGraph();
      }
    }

    function connectGraph() {
      if (!audioCtx || !sourceNode || !gainNode) return;

      // Limpia conexiones previas
      try { sourceNode.disconnect(); } catch(_) {}
      try { musicReducer?.disconnect(); } catch(_) {}
      try { voiceEQ?.disconnect(); } catch(_) {}      
      try { compressorNode?.disconnect(); } catch(_) {}
      try { smartLimiter?.disconnect(); } catch(_) {}
      try { gainNode.disconnect(); } catch(_) {}

      if (isNormalizeOn && compressorNode) {
  	sourceNode.connect(musicReducer);
	musicReducer.connect(voiceEQ);
	voiceEQ.connect(compressorNode);
	compressorNode.connect(smartLimiter);
        smartLimiter.connect(gainNode);
      } else {
	sourceNode.connect(musicReducer);
	musicReducer.connect(voiceEQ);
	voiceEQ.connect(gainNode);
      }

      gainNode.connect(audioCtx.destination);
    }
    // Reanuda contexto si está suspendido por políticas de autoplay
    video.addEventListener('play', () => {
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    }, { passive: true });

    function setBannerTitleFromFile(fileName){
      const title = fileName ? fileName.replace(/\.[^/.]+$/, '') : 'Sin título';
      videoTitleEl.textContent = title;

      if (progressRange) {
        ['mousedown', 'pointerdown', 'touchstart', 'change', 'input'].forEach(evt => {
          progressRange.addEventListener(evt, () => progressRange.blur(), { passive: true });
        });
      }
    }
    player.on('ready', defocusControls);
  </script>
</body>
</html>
